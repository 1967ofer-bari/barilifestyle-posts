<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Heebo;src:url(fonts/heebo-hebrew-400-normal.woff2);font-weight:400}
@font-face{font-family:Heebo;src:url(fonts/heebo-hebrew-700-normal.woff2);font-weight:700}
@font-face{font-family:Heebo;src:url(fonts/heebo-hebrew-800-normal.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Heebo,sans-serif;background:#1E4A55}
.scene{position:absolute;inset:0;opacity:0}
/* scene 1: hook */
#s1{background:radial-gradient(circle at 50% 40%,#2A6170 0%,#1E4A55 55%,#143540 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 90px;text-align:center}
#s1 .a{color:#FFFDF8;font-weight:800;font-size:112px;line-height:1.15}
#s1 .b{color:#D9B77F;font-weight:800;font-size:96px;line-height:1.2;margin-top:70px}
/* scene 2: tip */
#s2{background:linear-gradient(180deg,#FFFDF8 0%,#EFE7D6 100%);padding:150px 90px 0}
.logo{position:absolute;top:70px;left:70px;width:300px}
.pill{display:inline-block;background:#B8925A;color:#fff;font-weight:700;font-size:44px;padding:14px 40px;border-radius:60px;margin-top:330px}
#s2 h1{color:#1E4A55;font-weight:800;font-size:132px;line-height:1.05;margin-top:40px}
.line{color:#1E4A55;font-weight:400;font-size:62px;line-height:1.35;margin-top:56px;padding-right:34px;border-right:10px solid #B8925A}
.line b{font-weight:800}
/* scene 3: cta */
#s3{background:linear-gradient(170deg,#1E4A55 0%,#2F6B5E 100%);display:flex;flex-direction:column;align-items:center;padding-top:190px;text-align:center}
.photo{width:620px;height:620px;border-radius:50%;overflow:hidden;border:12px solid #B8925A;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
#s3 .q{color:#FFFDF8;font-weight:800;font-size:84px;line-height:1.2;margin-top:80px;padding:0 80px}
#s3 .who{color:#D9B77F;font-weight:700;font-size:50px;margin-top:40px}
#s3 .url{margin-top:70px;background:#FFFDF8;color:#1E4A55;font-weight:800;font-size:58px;padding:26px 64px;border-radius:80px;direction:ltr}
.bar{position:absolute;bottom:0;right:0;height:12px;background:#B8925A}
</style></head><body>

<div class="scene" id="s1">
  <div class="a" id="h1">{{hook1}}</div>
  <div class="b" id="h2">{{hook2}}</div>
</div>

<div class="scene" id="s2">
  <img class="logo" src="../../brand/logo.jpg">
  <div class="pill" id="p">{{label}}</div>
  <h1 id="t">{{title}}</h1>
  <div class="line" id="l1">{{line1}}</div>
  <div class="line" id="l2">{{line2}}</div>
  <div class="line" id="l3">{{line3}}</div>
</div>

<div class="scene" id="s3">
  <div class="photo" id="ph"><img id="img" src="../../brand/hero-halo.jpg"></div>
  <div class="q" id="q">{{closing}}</div>
  <div class="who" id="w">אתי ועופר לקסמן · BariLifestyle</div>
  <div class="url" id="u">{{url}}</div>
</div>

<div class="bar" id="bar"></div>

<script>
const D=14;
const $=id=>document.getElementById(id);
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
function rev(el,t,start,dur=0.5,dy=50){const k=ease((t-start)/dur);el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`;}
function scene(el,t,a,b){const fi=clamp((t-a)/0.3),fo=clamp((b-t)/0.3);el.style.opacity=Math.min(fi,fo);}
window.render=function(t){
  scene($('s1'),t,-1,3.2); scene($('s2'),t,2.9,9.4); scene($('s3'),t,9.1,99);
  rev($('h1'),t,0.1,0.5,60); const z=1+0.04*ease((t-0.1)/3); $('h1').style.transform+=` scale(${z})`;
  rev($('h2'),t,1.3,0.45,60);
  rev($('p'),t,3.2,0.4,30); rev($('t'),t,3.5,0.5,40);
  rev($('l1'),t,4.3); rev($('l2'),t,6.0); rev($('l3'),t,7.4);
  const pk=ease((t-9.3)/0.7); $('ph').style.opacity=pk; $('ph').style.transform=`scale(${0.85+0.15*pk})`;
  rev($('q'),t,10.0); rev($('w'),t,10.6); rev($('u'),t,11.2,0.5,30);
  $('bar').style.width=(100*clamp(t/D))+'%';
};
window.render(0);
</script></body></html>
